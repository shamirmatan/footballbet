name: Cron — daily winning chances

# Schedule paused: WC26 is archived and Euro28 hasn't started, so there's no
# live tournament for this to simulate right now (updateChances.ts no-ops
# without one anyway, but no reason to keep spinning it up daily). Re-add the
# `schedule:` trigger below once a tournament is live again, or run it by
# hand via workflow_dispatch in the meantime.
on:
  # schedule:
  #   # 04:00 UTC = 07:00 Israel (IDT, UTC+3) during the tournament.
  #   - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  chances:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm run cron:chances
        env:
          MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
