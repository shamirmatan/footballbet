name: One-off — rename euro26 to euro28, copy WC26 participants

# Manual, one-shot admin task — not scheduled. Run once from the Actions tab
# (pick this branch first if it hasn't been merged to main yet), with
# execute unchecked to preview, then again with execute checked to apply.
# Delete this workflow file once it's done its job.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Apply changes (unchecked = dry-run only, writes nothing)'
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Rename euro26 -> euro28 and set its knockout format
        run: |
          npx ts-node scripts/manageTournament.ts --tournament euro26 --rename-slug euro28 \
            --name "UEFA Euro 2028" --short-name "Euro 2028" \
            --groups-count 6 --third-place-slots 4 \
            --knockout-stages LAST_16,QUARTER_FINALS,SEMI_FINALS,FINAL \
            ${{ inputs.execute && '--execute' || '' }}
        env:
          MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

      # Only meaningful once the rename above has actually applied (euro28
      # must exist) — in a dry-run (execute unchecked) this step is expected
      # to fail with "no tournament found with slug euro28", since nothing
      # was renamed yet. That's not a bug, just this step's own preview.
      - name: Copy participants wc26 -> euro28
        run: |
          npx ts-node scripts/copyParticipants.ts --from wc26 --to euro28 \
            ${{ inputs.execute && '--execute' || '' }}
        env:
          MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
