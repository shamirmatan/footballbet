<div class="page" [class.page--wide]="isDraftTab">
  <mat-tab-group class="home-tabs" mat-stretch-tabs="true" dynamicHeight
                 (selectedTabChange)="isDraftTab = $event.index === 3">
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">leaderboard</mat-icon>
        <span class="tab-label">Standings</span>
      </ng-template>
      <div class="tab-panel">
        <app-participant-list></app-participant-list>
      </div>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">account_tree</mat-icon>
        <span class="tab-label">Playoffs</span>
      </ng-template>
      <div class="tab-panel">
        <app-bracket></app-bracket>
      </div>
    </mat-tab>

    <!-- Only de-emphasised once the group stage has actually given way to
         the knockout rounds (or the tournament is over) — still front and
         centre before then, e.g. for a tournament that hasn't kicked off. -->
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon" [class.tab-icon--muted]="groupsOver">grid_view</mat-icon>
        <span class="tab-label" [class.tab-label--muted]="groupsOver">Groups</span>
      </ng-template>
      <div class="tab-panel">
        <app-groups></app-groups>
      </div>
    </mat-tab>

    <!-- Only de-emphasised once the draft is actually locked. -->
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon" [class.tab-icon--muted]="draftLocked">how_to_reg</mat-icon>
        <span class="tab-label" [class.tab-label--muted]="draftLocked">Draft</span>
      </ng-template>
      <div class="tab-panel">
        <app-team-picker [viewerOnly]="true"></app-team-picker>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
