<div class="team-modal" *ngIf="selected" (click)="close()">
  <div
    class="team-modal__card"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="selected.name + ' matches'"
  >
    <div class="team-modal__head">
      <span class="team-modal__flag"><img *ngIf="headerLogo" [src]="headerLogo" [alt]="selected.name" /></span>
      <span class="team-modal__title">{{ selected.name }}</span>
      <button type="button" class="team-modal__close" (click)="close()" aria-label="Close">✕</button>
    </div>

    <div class="team-modal__body">
      <p class="team-modal__msg" *ngIf="matchesLoading">Loading matches…</p>
      <p class="team-modal__msg" *ngIf="!matchesLoading && selectedMatches.length === 0">No matches found.</p>

      <div
        class="tm-match"
        *ngFor="let m of selectedMatches"
        [class.tm-match--live]="isLiveMatch(m)"
      >
        <div class="tm-match__meta">
          <span class="tm-match__stage">{{ stageLabel(m) }}</span>
          <span class="tm-match__status" [class.tm-match__status--live]="isLiveMatch(m)">{{ matchStatusLabel(m) }}</span>
        </div>
        <div class="tm-match__sides">
          <div class="tm-match__team" [class.tm-match__team--self]="m.homeTeam.name === selected.name">
            <img class="tm-match__logo" *ngIf="m.homeTeam.logo" [src]="m.homeTeam.logo" [alt]="m.homeTeam.name || ''" />
            <span class="tm-match__name">{{ m.homeTeam.name || 'TBD' }}</span>
            <span class="tm-match__pen" *ngIf="pensWinnerSide(m) === 'home'" title="Won on penalties">PEN&nbsp;✓</span>
            <span class="tm-match__score" *ngIf="hasScore(m)">{{ m.scoreHome ?? 0 }}</span>
          </div>
          <div class="tm-match__team" [class.tm-match__team--self]="m.awayTeam.name === selected.name">
            <img class="tm-match__logo" *ngIf="m.awayTeam.logo" [src]="m.awayTeam.logo" [alt]="m.awayTeam.name || ''" />
            <span class="tm-match__name">{{ m.awayTeam.name || 'TBD' }}</span>
            <span class="tm-match__pen" *ngIf="pensWinnerSide(m) === 'away'" title="Won on penalties">PEN&nbsp;✓</span>
            <span class="tm-match__score" *ngIf="hasScore(m)">{{ m.scoreAway ?? 0 }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
