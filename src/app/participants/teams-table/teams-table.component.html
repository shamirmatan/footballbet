<div class="teams-panel">
  <div class="teams-summary">
    <span class="teams-summary__item"><strong>{{ summary.total }}</strong> teams</span>
    <span class="teams-summary__sep" aria-hidden="true">·</span>
    <span class="teams-summary__item"><strong>{{ summary.played }}</strong> played</span>
    <span class="teams-summary__sep" aria-hidden="true">·</span>
    <span class="teams-summary__item"><strong>{{ summary.advanced }}</strong> advanced</span>
    <span class="teams-summary__sep" aria-hidden="true">·</span>
    <span class="teams-summary__item teams-summary__item--muted"><strong>{{ summary.eliminated }}</strong> eliminated</span>
  </div>

  <ul class="team-list">
    <li
      *ngFor="let team of sortedTeams"
      class="team-row"
      [class.team-row--eliminated]="team.eliminated"
    >
      <span class="team-row__flag">
        <img [src]="team.logo" [alt]="team.name" loading="lazy" />
      </span>
      <span class="team-row__name">{{ team.name }}</span>
      <span class="team-row__group" *ngIf="team.group">Group {{ team.group }}</span>
      <span class="team-row__stats">
        <span class="stat" title="Wins (knockout draws via ET/pens not counted as wins)"><span class="stat__k">W</span><span class="stat__v">{{ team.totalWins }}</span></span>
        <span class="stat" title="Draws (includes knockouts that went to ET/pens)"><span class="stat__k">D</span><span class="stat__v">{{ team.totalDraws }}</span></span>
        <span class="stat" title="Losses"><span class="stat__k">L</span><span class="stat__v">{{ team.totalLosses }}</span></span>
        <span class="stat stat--qual" title="Knockout rounds advanced" *ngIf="team.qualifications > 0">
          <span class="stat__k">Q</span><span class="stat__v">{{ team.qualifications }}</span>
        </span>
      </span>
      <span class="team-row__points">
        <span class="team-row__points-value">{{ team.points }}</span>
        <span class="team-row__points-label">pts</span>
      </span>
    </li>
  </ul>
</div>
