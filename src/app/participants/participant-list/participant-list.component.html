<img *ngIf="isLoading" class="ball-spinner" src="assets/trionda.png" alt="Loading…" />

<mat-accordion class="participants" multi="true" *ngIf="participants.length > 0 && !isLoading">
  <mat-expansion-panel class="participant-card" *ngFor="let participant of participants" hideToggle>
    <mat-expansion-panel-header class="participant-card__header" collapsedHeight="84px" expandedHeight="84px">
      <mat-panel-title class="participant-card__identity">
        <span class="rank-badge" [ngClass]="rankClass(participant.position)">{{ participant.position }}</span>
        <span class="participant-card__avatar">
          <img src="../../../assets/{{participant.lastName}}.jpg" [alt]="participant.firstName + ' ' + participant.lastName" />
        </span>
        <span class="participant-card__name">{{ displayName(participant) }}</span>
      </mat-panel-title>
      <mat-panel-description class="participant-card__points">
        <span class="chance-chip" *ngIf="participant.chances != null">
          <span class="chance-chip__value">{{ participant.chances }}%</span>
          <span class="chance-chip__label">win</span>
        </span>
        <span class="points-chip">
          <span class="points-chip__value">{{ participant.points }}</span>
          <span class="points-chip__label">pts</span>
        </span>
      </mat-panel-description>
    </mat-expansion-panel-header>
    <app-teams-table [teams]="participant.teams"></app-teams-table>
  </mat-expansion-panel>
</mat-accordion>

<p class="info-text" *ngIf="participants.length <= 0 && !isLoading">No Participants Found!</p>
