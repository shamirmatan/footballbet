<table mat-table [dataSource]="teams" class="mat-elevation-z8">

  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- Logo Column -->
  <ng-container matColumnDef="logo">
    <th class="logo-header" mat-header-cell *matHeaderCellDef></th>
    <td class="logo-img" mat-cell *matCellDef="let element"> <img [src]="element.logo" /> </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Team </th>
    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
  </ng-container>

  <!-- Games Column -->
  <ng-container matColumnDef="games">
    <th mat-header-cell *matHeaderCellDef> G </th>
    <td mat-cell *matCellDef="let element"> {{element.games}} </td>
  </ng-container>

  <!-- Wins Column -->
  <ng-container matColumnDef="wins">
    <th mat-header-cell *matHeaderCellDef> W </th>
    <td mat-cell *matCellDef="let element"> {{element.wins}} </td>
  </ng-container>

  <!-- Ties Column -->
  <ng-container matColumnDef="draws">
    <th mat-header-cell *matHeaderCellDef> D </th>
    <td mat-cell *matCellDef="let element"> {{element.draws}} </td>
  </ng-container>

  <!-- Losses Column -->
  <ng-container matColumnDef="losses">
    <th mat-header-cell *matHeaderCellDef> L </th>
    <td mat-cell *matCellDef="let element"> {{element.losses}} </td>
  </ng-container>

  <!-- Points Column -->
  <ng-container matColumnDef="points">
    <th mat-header-cell *matHeaderCellDef> Pts </th>
    <td mat-cell *matCellDef="let element"> {{element.points}} </td>
  </ng-container>

  <!-- Next Games Column -->
  <ng-container matColumnDef="qualifications">
    <th mat-header-cell *matHeaderCellDef> Q </th>
    <td mat-cell *matCellDef="let element"> {{element.qualifications}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" [ngClass]="{'make-red': row.eliminated }"></tr>
</table>
