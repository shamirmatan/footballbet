<div class="bracket">
  <img *ngIf="loading" class="ball-spinner" src="assets/trionda.png" alt="Loading…" />

  <p class="empty" *ngIf="!loading && !hasStages">
    Knockout fixtures appear once the bracket is drawn.
  </p>

  <ng-container *ngIf="!loading && hasStages">
    <!-- Horizontally-scrollable bracket tree -->
    <div class="tree-scroll">
      <div class="tree-headers" [style.width.px]="treeWidth">
        <div
          class="tree-headers__col"
          *ngFor="let col of columns; trackBy: trackByColumn"
          [style.width.px]="columnWidth"
        >
          {{ col.label }}
        </div>
      </div>

      <div
        class="tree"
        [style.width.px]="treeWidth"
        [style.height.px]="treeHeight"
      >
        <!-- Connector lines -->
        <svg
          class="tree__lines"
          [attr.width]="treeWidth"
          [attr.height]="treeHeight"
          [attr.viewBox]="'0 0 ' + treeWidth + ' ' + treeHeight"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <path *ngFor="let c of connectors" [attr.d]="c.d" class="connector" />
        </svg>

        <!-- Columns of match cards -->
        <div class="tree__col" *ngFor="let col of columns; trackBy: trackByColumn">
          <article
            class="card"
            *ngFor="let c of col.cards; trackBy: trackByMatch"
            [class.card--live]="isLive(c.match)"
            [style.top.px]="c.cy - cardHeight / 2"
            [style.width.px]="columnWidth"
          >
            <div
              class="card__side"
              [class.card__side--loser]="loserSide(c.match) === 'home'"
              [class.card__side--tbd]="!c.match.home.resolved"
            >
              <span class="card__flag">
                <img *ngIf="c.match.home.logo" [src]="c.match.home.logo" [alt]="c.match.home.name || 'TBD'" />
              </span>
              <span class="card__name-col">
                <span class="card__name" [class.team-clickable]="c.match.home.resolved" (click)="c.match.home.resolved && openTeam(c.match.home.name, c.match.home.logo)">{{ c.match.home.name || 'TBD' }}</span>
                <span class="card__pen-badge" *ngIf="pensWinnerSide(c.match) === 'home'" title="Won on penalties">PEN&nbsp;✓</span>
                <span class="card__owner" *ngIf="c.match.home.resolved && ownerOf(c.match.home.name)">{{ ownerOf(c.match.home.name) }}</span>
              </span>
              <span class="card__score" *ngIf="c.match.scoreHome !== null">{{ c.match.scoreHome }}</span>
            </div>
            <div
              class="card__side"
              [class.card__side--loser]="loserSide(c.match) === 'away'"
              [class.card__side--tbd]="!c.match.away.resolved"
            >
              <span class="card__flag">
                <img *ngIf="c.match.away.logo" [src]="c.match.away.logo" [alt]="c.match.away.name || 'TBD'" />
              </span>
              <span class="card__name-col">
                <span class="card__name" [class.team-clickable]="c.match.away.resolved" (click)="c.match.away.resolved && openTeam(c.match.away.name, c.match.away.logo)">{{ c.match.away.name || 'TBD' }}</span>
                <span class="card__pen-badge" *ngIf="pensWinnerSide(c.match) === 'away'" title="Won on penalties">PEN&nbsp;✓</span>
                <span class="card__owner" *ngIf="c.match.away.resolved && ownerOf(c.match.away.name)">{{ ownerOf(c.match.away.name) }}</span>
              </span>
              <span class="card__score" *ngIf="c.match.scoreAway !== null">{{ c.match.scoreAway }}</span>
            </div>
            <span
              class="card__status"
              *ngIf="statusLabel(c.match)"
              [class.card__status--live]="isLive(c.match)"
              [class.card__status--final]="c.match.status === 'FINISHED'"
            >
              <span class="live-dot" *ngIf="isLive(c.match)" aria-hidden="true"></span>
              {{ statusLabel(c.match) }}
            </span>
          </article>
        </div>
      </div>
    </div>
  </ng-container>
</div>
