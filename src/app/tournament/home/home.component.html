<div class="page" [class.page--wide]="isDraftTab">
  <mat-tab-group class="home-tabs" mat-stretch-tabs="true" dynamicHeight
                 (selectedTabChange)="isDraftTab = $event.index === 3">
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">leaderboard</mat-icon>
        <span class="tab-label">Standings</span>
      </ng-template>
      <div class="tab-panel">
        <app-participant-list></app-participant-list>
      </div>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">grid_view</mat-icon>
        <span class="tab-label">Groups</span>
      </ng-template>
      <div class="tab-panel">
        <app-groups></app-groups>
      </div>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">account_tree</mat-icon>
        <span class="tab-label">Playoffs</span>
      </ng-template>
      <div class="tab-panel">
        <app-bracket></app-bracket>
      </div>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">how_to_reg</mat-icon>
        <span class="tab-label">Draft</span>
      </ng-template>
      <div class="tab-panel">
        <app-team-picker></app-team-picker>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
